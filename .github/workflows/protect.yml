name: Protections

on:
  push:
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed secrets
        run: |
          set -euo pipefail
          forbidden=(
            .env
            Fiber/Resources/AppleMusicToken.json
            Fiber/Resources/SpotifyConfig.json
            Config/Signing.xcconfig
          )
          for path in "${forbidden[@]}"; do
            if [[ -e "$path" ]]; then
              echo "::error::Refusing to keep $path in the repository."
              exit 1
            fi
          done
          if git grep -I -n -E 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY|eyJhbGciOi' -- . ':(exclude).github/workflows/protect.yml' >/tmp/hits; then
            echo "::error::A private key or signed token looks committed."
            cat /tmp/hits
            exit 1
          fi
